<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Şifremi Unuttum | Neon Auth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 80% 20%, #2d1157 0%, #090717 55%, #160a33 100%);
      color: #fff; padding: 20px;
    }
    .card {
      width: 100%; max-width: 400px; background: rgba(16, 13, 36, 0.78);
      backdrop-filter: blur(18px); border: 1px solid rgba(139, 92, 246, 0.28);
      border-radius: 22px; padding: 36px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 35px rgba(99, 102, 241, 0.18);
    }
    .top-bar { width: 46px; height: 4px; background: rgba(255,255,255,0.22); border-radius: 4px; margin: 0 auto 24px; }
    h1 { text-align: center; font-size: 1.75rem; margin-bottom: 10px; }
    .subtitle { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; line-height: 1.45; }
    .input-group {
      display: flex; align-items: center; background: rgba(11, 10, 26, 0.85);
      border: 1px solid rgba(139, 92, 246, 0.25); border-radius: 12px;
      padding: 12px 14px; margin-bottom: 20px; transition: border-color 0.25s, box-shadow 0.25s;
    }
    .input-group:focus-within { border-color: #7c3aed; box-shadow: 0 0 14px rgba(124, 58, 237, 0.45); }
    .icon { width: 20px; height: 20px; stroke: #a5b4fc; margin-right: 10px; flex-shrink: 0; }
    .divider { width: 1px; height: 18px; background: rgba(255,255,255,0.18); margin-right: 12px; }
    input { width: 100%; background: transparent; border: none; outline: none; color: #f8fafc; font-size: 0.96rem; }
    input::placeholder { color: #8b92b2; }
    .btn-primary {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #3b28cc, #5b21b6); color: #fff;
      font-size: 0.98rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 0 18px rgba(79, 70, 229, 0.55); transition: transform 0.2s, box-shadow 0.25s, filter 0.25s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 28px rgba(124, 58, 237, 0.9), 0 0 45px rgba(59, 130, 246, 0.5); filter: brightness(1.12); }
    .footer-text { text-align: center; margin-top: 24px; font-size: 0.9rem; color: #cbd5e1; }
    .footer-text a { color: #fff; font-weight: 600; text-decoration: underline; }
    .message { margin-bottom: 14px; padding: 10px 12px; border-radius: 10px; font-size: 0.86rem; display: none; text-align: center; }
    .message.error { display: block; background: rgba(239, 68, 68, 0.18); border: 1px solid #ef4444; color: #fca5a5; }
    .message.success { display: block; background: rgba(34, 197, 94, 0.18); border: 1px solid #22c55e; color: #86efac; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar"></div>
    <h1>Şifremi Unuttum</h1>
    <p class="subtitle">Kayıtlı e-posta adresinizi girin, size şifre sıfırlama bağlantısı gönderelim.</p>
    <div id="statusMsg" class="message"></div>
    <form id="forgotForm" novalidate>
      <div class="input-group">
        <svg class="icon" fill="none" viewBox="0 0 24 24" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="M3 8l9 6 9-6" /></svg>
        <div class="divider"></div>
        <input type="email" id="resetEmail" placeholder="E-posta Adresi" required />
      </div>
      <button type="submit" class="btn-primary">Şifre Sıfırlama Bağlantısı Gönder</button>
    </form>
    <p class="footer-text"><a href="index.html">← Giriş sayfasına dön</a></p>
  </div>
  <script>
    document.getElementById("forgotForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("resetEmail").value.trim();
      const msg = document.getElementById("statusMsg");
      if (!email) { msg.className = "message error"; msg.textContent = "Lütfen e-posta adresinizi girin."; return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.className = "message error"; msg.textContent = "Geçerli bir e-posta formatı girin."; return; }
      msg.className = "message success"; msg.textContent = "Şifre sıfırlama bağlantısı " + email + " adresine gönderildi.";
    });
  </script>
</body>
</html>
